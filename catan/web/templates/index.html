<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Lobby Section -->
        <div id="lobby-view" class="view active">
            <div class="lobby-container">
                <h1>Catan Online</h1>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Enter your username">
                </div>
                <div class="actions">
                    <button id="create-game-btn" class="btn primary">Create Game</button>
                    <div class="join-group">
                        <input type="text" id="room-id-input" placeholder="Room ID">
                        <button id="join-game-btn" class="btn secondary">Join Game</button>
                    </div>
                </div>
                <div id="lobby-status" class="hidden">
                    <h2>Room: <span id="current-room-id"></span></h2>
                    <h3>Players:</h3>
                    <ul id="player-list"></ul>
                    <button id="start-game-btn" class="btn success hidden">Start Game</button>
                    <p id="waiting-msg">Waiting for host to start...</p>
                </div>
            </div>
        </div>

        <!-- Game Section -->
        <div id="game-view" class="view hidden">
            <div class="game-layout">
                <!-- Sidebar: Stats & Chat -->
                <div class="sidebar left-sidebar">
                    <div class="player-stats">
                        <h3>Players</h3>
                        <div id="players-container"></div>
                    </div>
                    <div class="game-log">
                        <h3>Game Log</h3>
                        <div id="log-container"></div>
                    </div>
                </div>

                <!-- Main Board Area -->
                <div class="board-area">
                    <div id="game-board">
                        <!-- SVG Board will be rendered here -->
                    </div>
                    <div class="controls-overlay">
                        <div id="turn-indicator">It's <span id="current-turn-player">Player</span>'s turn</div>
                        <div class="action-buttons">
                            <button id="roll-dice-btn" class="btn action">Roll Dice</button>
                            <button id="end-turn-btn" class="btn action">End Turn</button>
                        </div>
                        <div id="dice-result" class="hidden">Rolled: <span id="dice-value"></span></div>
                    </div>
                </div>

                <!-- Sidebar: Actions & Cards -->
                <div class="sidebar right-sidebar">
                    <div class="resources">
                        <h3>Your Resources</h3>
                        <div id="resource-display"></div>
                    </div>
                    <div class="build-menu">
                        <h3>Build</h3>
                        <button class="btn build" data-type="road">Road (1 Brick, 1 Wood)</button>
                        <button class="btn build" data-type="settlement">Settlement (1 Brick, 1 Wood, 1 Wool, 1 Grain)</button>
                        <button class="btn build" data-type="city">City (2 Grain, 3 Ore)</button>
                        <button class="btn build" data-type="devcard">Dev Card (1 Ore, 1 Wool, 1 Grain)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
