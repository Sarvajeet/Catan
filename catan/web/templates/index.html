<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to Catan!</h1>
    <div id="game-container">
        <div id="game-board">
            <!-- The game board will be rendered here using JavaScript -->
        </div>
        <div id="game-log-container">
            <h3>Game Log</h3>
            <ul id="game-log"></ul>
        </div>
    </div>
    <div id="players-container">
        <!-- Player information will be dynamically inserted here -->
    </div>
    <div id="status-messages"></div>
    <div id="actions">
        <button id="roll-dice-btn">Roll Dice</button>
        <button id="build-road-btn">Build Road</button>
        <button id="build-settlement-btn">Build Settlement</button>
        <button id="build-city-btn">Build City</button>
        <button id="trade-btn">Trade</button>
    </div>

    <!-- Trade Modal -->
    <div id="trade-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Propose a Trade</h2>
            <form id="trade-form">
                <div>
                    <label for="trade-partner">Trade with:</label>
                    <select id="trade-partner" name="trade-partner" required></select>
                </div>
                <div class="trade-resources">
                    <div id="offer-resources">
                        <h3>You Offer:</h3>
                        <!-- Resource inputs will be generated here -->
                    </div>
                    <div id="request-resources">
                        <h3>You Request:</h3>
                        <!-- Resource inputs will be generated here -->
                    </div>
                </div>
                <button type="submit">Propose Trade</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
